group = dropnext
version = 0.0.1

# build config
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kapt.incremental.apt=true

# See https://github.com/gradle/gradle/issues/11308
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Increase the memory to run on GH Actions
# See: https://github.com/gradle/gradle/issues/8139
# JDK 24+: Gradle’s native helpers call System.load; allow it so the daemon doesn’t warn.
# See https://openjdk.org/jeps/472
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED

