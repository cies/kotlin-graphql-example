openapi: 3.0.3
info:
  title: DropNext Shopify Service API
  version: v1
  description: |
    This API is how our **main backend app** (monolith) asks the **Shopify service** to call Shopify Admin API.

    The service is **stateless**: it does not persist shop rows or tokens. For each fulfillment call, pass either
    header **`X-Shopify-Access-Token`** (Admin API token for that shop) or configure env **`DSS_SHOP_ACCESS_TOKENS`**
    (`shop.myshopify.com|shpat_…` pairs, comma-separated). Optional **`DSS_INTERNAL_SECRET`** still gates these routes.

    **Normal URLs:** `/sync-shipments-with-fulfillments` and `/tracking-updates` (or `/tracking-update`).

    **`/dummy1` and `/dummy2`:** Workaround for some OpenAPI tooling (http4k#1516). `/dummy1` = tracking,
    `/dummy2` = shipment sync.

servers:
  - url: /
    description: Your app's base URL (same server that runs this API)

tags:
  - name: fulfillments

paths:
  /sync-shipments-with-fulfillments:
    post:
      tags: [fulfillments]
      summary: Tell Shopify about new shipments (and cancel old fulfillments if needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsRequest"
      responses:
        "200":
          description: Shipments were synced and new fulfillment IDs were returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsResponse"
        "400":
          description: Shopify said no, or we couldn't match variants / fulfillment orders - check the error text
        "401":
          description: Wrong or missing `X-DSS-Internal-Secret`, missing Admin token header / env map, or invalid token

  /tracking-updates:
    post:
      tags: [fulfillments]
      summary: Post a tracking update (like "in transit" or "delivered")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdateRequest"
      responses:
        "200":
          description: Tracking update was accepted and a fulfillment event was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"
        "400":
          description: Shopify rejected the event or we couldn't build it - see error message
        "401":
          description: Wrong or missing secret header (if configured)

  /tracking-update:
    post:
      tags: [fulfillments]
      summary: Same as `/tracking-updates` (shorter name some specs use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdateRequest"
      responses:
        "200":
          description: Tracking update was accepted and a fulfillment event was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"

  /dummy1:
    post:
      tags: [fulfillments]
      summary: Workaround route - same as "post tracking update"
      description: |
        **Same as `/tracking-updates`.** Only exists because some code generators mishandle certain OpenAPI layouts.
        Use `/tracking-updates` in new code; use this only if your client was generated with `dummy1` in the spec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdateRequest"
      responses:
        "200":
          description: Tracking update was accepted and a fulfillment event was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"

  /stores/api-key:
    put:
      summary: Set Shopify Admin API token for a store
      description: |
        Stores the Shopify Admin API access token for a shop without going through OAuth.
        Use this when you already have a token (e.g. from a previous OAuth flow or a manual setup)
        and want to register it with the running service.

        - Saves the token to the monolith via `PUT /stores/api-key` (requires `MONOLITH_BASE_URL`).
        - Caches the token in the in-memory map immediately — no restart needed.
        - Requires `X-DSS-Internal-Secret` header if `DSS_INTERNAL_SECRET` is set.
      parameters:
        - $ref: "#/components/parameters/DssInternalSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutShopAccessTokenRequest"
      responses:
        "200":
          description: Token saved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutShopAccessTokenResponse"
        "400":
          description: Missing or invalid `shopify_subdomain`.
        "401":
          description: Wrong or missing `X-DSS-Internal-Secret`.

  /dummy2:
    post:
      tags: [fulfillments]
      summary: Workaround route - same as "sync shipments with fulfillments"
      description: |
        **Same as `/sync-shipments-with-fulfillments`.** See `/dummy1` - tooling workaround only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsRequest"
      responses:
        "200":
          description: Shipments were synced and new fulfillment IDs were returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsResponse"

components:
  schemas:
    # --- Shared ---
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # --- Inbound: monolith → DSS (webhook contracts) ---
    ShipmentLineItem:
      type: object
      required: [product_variant_id, quantity]
      properties:
        product_variant_id:
          type: integer
          format: int64
        quantity:
          type: integer

    Shipment:
      type: object
      required: [tracking_number, line_items]
      properties:
        tracking_number:
          type: string
        carrier:
          type: string
          nullable: true
        tracking_url:
          type: string
          nullable: true
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentLineItem"

    SyncShipmentsWithFulfillmentsRequest:
      type: object
      description: |
        Sent by the monolith when a supplier creates or re-organises shipments.
        The DSS cancels all existing Shopify fulfillments for the order, then creates
        new ones from the provided shipments.
      required: [shopify_subdomain, shopify_order_id, shipments]
      properties:
        shopify_subdomain:
          type: string
        shopify_order_id:
          type: integer
          format: int64
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/Shipment"

    SyncShipmentsWithFulfillmentsResponse:
      type: object
      required: [new_fulfillment_ids]
      properties:
        new_fulfillment_ids:
          type: array
          items:
            type: integer
            format: int64

    TrackingUpdateRequest:
      type: object
      description: |
        Sent by the monolith when a tracking status update arrives (e.g. from AfterShip).
        The DSS locates the Shopify fulfillment by order + tracking number and creates a FulfillmentEvent.
      required: [shopify_subdomain, shopify_order_id, tracking_number, status, happened_at]
      properties:
        shopify_subdomain:
          type: string
        shopify_order_id:
          type: integer
          format: int64
        tracking_number:
          type: string
        status:
          type: string
          description: |
            Plain-text status (for example `in_transit`). The service maps this to what Shopify expects.
        happened_at:
          type: string
        message:
          type: string
          nullable: true

    TrackingUpdateResponse:
      type: object
      required: [fulfillment_event_id]
      properties:
        fulfillment_event_id:
          type: integer
          format: int64

    # --- Outbound: DSS → monolith (client DTOs) ---
    ShippingAddress:
      type: object
      required: [address1, city, country_code]
      properties:
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        address1: { type: string }
        address2: { type: string, nullable: true }
        city: { type: string }
        province: { type: string, nullable: true }
        province_code: { type: string, nullable: true }
        country_code: { type: string }
        zip: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    OrderLineItem:
      type: object
      required:
        - shopify_line_item_id
        - product_variant_id
        - quantity
        - fulfillment_order_id
        - snapshot_of_variant_title
        - snapshot_of_product_title
        - snapshot_of_price_in_minor_units
      properties:
        shopify_line_item_id: { type: integer, format: int64 }
        product_variant_id: { type: integer, format: int64 }
        quantity: { type: integer }
        fulfillment_order_id: { type: integer, format: int64 }
        snapshot_of_variant_title: { type: string }
        snapshot_of_product_title: { type: string }
        snapshot_of_price_in_minor_units: { type: integer, format: int64 }

    CreateShopifyOrderRequest:
      type: object
      description: JSON the Shopify service POSTs to the monolith on `orders/create` (outbound contract).
      required:
        - shopify_subdomain
        - shopify_order_id
        - name
        - financial_status
        - fulfillment_status
        - created_at
        - shipping_address
        - line_items
        - total_in_minor_units
        - currency
      properties:
        shopify_subdomain: { type: string }
        shopify_order_id: { type: integer, format: int64 }
        name: { type: string }
        financial_status: { type: string }
        fulfillment_status: { type: string, nullable: true }
        created_at: { type: string }
        shipping_address:
          $ref: "#/components/schemas/ShippingAddress"
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        total_in_minor_units:
          type: integer
          format: int64
          description: Order total in minor currency units (non-negative).
        currency:
          type: string
          description: ISO 4217 currency code (e.g. "USD").

    CreateOrderResponse:
      type: object
      required: [shopify_order_id]
      properties:
        shopify_order_id:
          type: integer
          format: int64

    # --- Inbound: set shop access token ---
    PutShopAccessTokenRequest:
      type: object
      required: [shopify_subdomain, api_key]
      properties:
        shopify_subdomain:
          type: string
          description: Short handle (e.g. `my-shop`) or full `*.myshopify.com` host.
        api_key:
          type: string
          description: Shopify Admin API access token (`shpat_…`).
        shopify_shop_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Optional numeric Shopify shop ID. When provided (and monolith is configured),
            the token is forwarded to the monolith via PUT /stores/api-key.

    PutShopAccessTokenResponse:
      type: object
      required: [shop]
      properties:
        shop:
          type: string
          description: Normalized `*.myshopify.com` host the token was saved under.

    # --- Outbound: stores ---
    StoreResponse:
      type: object
      required: [store_id, shopify_shop_id, api_key]
      properties:
        store_id: { type: integer, format: int64 }
        shopify_shop_id: { type: integer, format: int64 }
        api_key: { type: string, nullable: true }

    UpdateStoreApiKeyRequest:
      type: object
      required: [shopify_subdomain, shopify_shop_id, api_key]
      properties:
        shopify_subdomain: { type: string }
        shopify_shop_id: { type: integer, format: int64 }
        api_key: { type: string }

    UpdateStoreApiKeyResponse:
      type: object
      required: [store_id]
      properties:
        store_id: { type: integer, format: int64 }

    # --- Outbound: product variants ---
    ProductStatus:
      type: string
      enum: [active, draft, archived]

    SelectedOption:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    ProductVariantItem:
      type: object
      required:
        - product_variant_id
        - product_id
        - product_title
        - product_description
        - product_description_html
        - product_vendor
        - product_type
        - product_tags
        - product_handle
        - product_status
        - product_images
        - product_published_at
        - product_created_at
        - product_updated_at
        - title
        - sku
        - barcode
        - price_in_minor_units
        - price_currency
        - selected_options
        - image_url
      properties:
        product_variant_id: { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        product_title: { type: string }
        product_description: { type: string }
        product_description_html: { type: string }
        product_vendor: { type: string }
        product_type: { type: string }
        product_tags:
          type: array
          items: { type: string }
        product_handle: { type: string }
        product_status:
          $ref: "#/components/schemas/ProductStatus"
        product_images:
          type: array
          items: { type: string }
        product_published_at: { type: string, nullable: true }
        product_created_at: { type: string }
        product_updated_at: { type: string }
        title: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price_in_minor_units: { type: integer, format: int64 }
        price_currency: { type: string }
        selected_options:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOption"
        image_url: { type: string, nullable: true }

    UpsertProductVariantsRequest:
      type: object
      required: [shopify_subdomain, product_variants]
      properties:
        shopify_subdomain: { type: string }
        product_variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantItem"

    UpsertProductVariantsResponse:
      type: object
      required: [upserted]
      properties:
        upserted: { type: integer, format: int32 }

    DeleteProductVariantsRequest:
      type: object
      required: [shopify_subdomain, product_variant_ids]
      properties:
        shopify_subdomain: { type: string }
        product_variant_ids:
          type: array
          items: { type: integer, format: int64 }

    DeleteProductVariantsResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, format: int32 }

    VariantIdsResponse:
      type: object
      required: [product_variant_ids]
      properties:
        product_variant_ids:
          type: array
          items: { type: integer, format: int64 }

  parameters:
    DssInternalSecret:
      name: X-DSS-Internal-Secret
      in: header
      required: false
      schema:
        type: string
      description: |
        If whoever deployed the server set the `DSS_INTERNAL_SECRET` environment variable,
        every request must send this header with that same value - like a shared password between services.
    ShopifyAccessToken:
      name: X-Shopify-Access-Token
      in: header
      required: false
      schema:
        type: string
      description: |
        Shopify Admin API access token for the shop in the JSON body (`shopify_subdomain`). Required unless
        the server was configured with `DSS_SHOP_ACCESS_TOKENS` / `SANDBOX_ACCESS_TOKEN` for that shop.
