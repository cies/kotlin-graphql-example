openapi: 3.0.3
info:
  title: DropNext Shopify Service API
  version: v1
  description: |
    This API is how our **main backend app** (we call it the monolith) talks to the **Shopify service**.
    The Shopify service is a small server that holds store tokens and calls Shopify for you.

    **Normal URLs to use:** send shipment syncs to `/sync-shipments-with-fulfillments` and tracking updates
    to `/tracking-updates` (or `/tracking-update` - same thing).

    **`/dummy1` and `/dummy2`:** These exist only because of a bug in some OpenAPI tooling (see
    https://github.com/http4k/http4k/issues/1516). They are **not** “fake” features - they do the real work:
    `/dummy1` = same as tracking, `/dummy2` = same as shipment sync. Prefer the normal URLs above when you can.

servers:
  - url: /
    description: Your app’s base URL (same server that runs this API)

tags:
  - name: stores
  - name: product-variants
  - name: fulfillments

paths:
  /stores:
    get:
      tags: [stores]
      summary: Look up one store
      parameters:
        - name: shopify_subdomain
          in: query
          required: true
          schema:
            type: string
          description: Which shop - you can pass `cool-shop` or `cool-shop.myshopify.com`
      responses:
        "200":
          description: Found - returns store id, Shopify shop id, and saved token field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
        "400":
          description: Something wrong with the request (for example missing query param)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong or missing secret header - only if the server was set up with `DSS_INTERNAL_SECRET`
        "404":
          description: We don’t know this store yet
    put:
      tags: [stores]
      summary: Old path - same as “set API key” below
      description: |
        **Prefer `PUT /stores/api-key` instead.** This path does the same thing; we keep it so older clients don’t break.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreApiKeyRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStoreApiKeyResponse"
        "404":
          description: No store with that subdomain, or the shop id doesn’t match (safety check)

  /stores/api-key:
    put:
      tags: [stores]
      summary: Save the Shopify access token after install
      description: |
        Call this to **update the token and shop id** for a store we already know about.

        **Important:** This only works if the store is **already** in our database. When someone installs the app
        through Shopify, the server saves the store automatically - you usually don’t call this by hand unless
        your flow is different.

        If you send a shop id that doesn’t match what we have for that subdomain, we return 404 on purpose
        (so one shop can’t steal another’s token by typo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreApiKeyRequest"
      responses:
        "200":
          description: Saved - returns the internal `store_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStoreApiKeyResponse"
        "401":
          description: Wrong or missing secret header (if the server uses a secret)
        "404":
          description: No store with that subdomain, or shop id mismatch - see description above

  /product-variants:
    get:
      tags: [product-variants]
      summary: List variant IDs we’re tracking for a store
      parameters:
        - name: shopify_subdomain
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantIdsResponse"
        "401":
          description: Wrong or missing secret header (if configured)
        "404":
          description: We don’t have this store yet
    post:
      tags: [product-variants]
      summary: Add or update many product variants at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProductVariantsRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertProductVariantsResponse"
        "401":
          description: Unauthorized
        "404":
          description: We don’t have this store yet
    delete:
      tags: [product-variants]
      summary: Remove variant IDs from our list (soft-delete style)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProductVariantsRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProductVariantsResponse"
        "401":
          description: Wrong or missing secret header (if configured)

  /sync-shipments-with-fulfillments:
    post:
      tags: [fulfillments]
      summary: Tell Shopify about new shipments (and cancel old fulfillments if needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsPayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsResponse"
        "400":
          description: Shopify said no, or we couldn’t match variants / fulfillment orders - check the error text
        "401":
          description: Wrong or missing secret header (if configured)
        "404":
          description: No saved token for this store - install the app first

  /tracking-updates:
    post:
      tags: [fulfillments]
      summary: Post a tracking update (like “in transit” or “delivered”)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdatePayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"
        "400":
          description: Shopify rejected the event or we couldn’t build it - see error message
        "401":
          description: Wrong or missing secret header (if configured)

  /tracking-update:
    post:
      tags: [fulfillments]
      summary: Same as `/tracking-updates` (shorter name some specs use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdatePayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"

  /dummy1:
    post:
      tags: [fulfillments]
      summary: Workaround route - same as “post tracking update”
      description: |
        **Same as `/tracking-updates`.** Only exists because some code generators mishandle certain OpenAPI layouts.
        Use `/tracking-updates` in new code; use this only if your client was generated with `dummy1` in the spec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingUpdatePayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingUpdateResponse"

  /dummy2:
    post:
      tags: [fulfillments]
      summary: Workaround route - same as “sync shipments with fulfillments”
      description: |
        **Same as `/sync-shipments-with-fulfillments`.** See `/dummy1` - tooling workaround only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsPayload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncShipmentsWithFulfillmentsResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StoreResponse:
      type: object
      required: [store_id, shopify_shop_id, api_key]
      properties:
        store_id:
          type: integer
          format: int64
        shopify_shop_id:
          type: integer
          format: int64
        api_key:
          type: string
          nullable: true
          description: |
            The Shopify Admin API token for this store (the field is named `api_key` in the contract).
            **Keep it secret** - it’s like a password for the shop.
    UpdateStoreApiKeyRequest:
      type: object
      required: [shopify_subdomain, shopify_shop_id, api_key]
      properties:
        shopify_subdomain:
          type: string
        shopify_shop_id:
          type: integer
          format: int64
        api_key:
          type: string
    UpdateStoreApiKeyResponse:
      type: object
      required: [store_id]
      properties:
        store_id:
          type: integer
          format: int64
    VariantIdsResponse:
      type: object
      required: [product_variant_ids]
      properties:
        product_variant_ids:
          type: array
          items:
            type: integer
            format: int64
    ProductStatus:
      type: string
      enum: [active, draft, archived]
    SelectedOption:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    ProductVariantItem:
      type: object
      required:
        - product_variant_id
        - product_id
        - product_title
        - product_description
        - product_description_html
        - product_vendor
        - product_type
        - product_tags
        - product_handle
        - product_status
        - product_images
        - product_created_at
        - product_updated_at
        - title
        - price_in_minor_units
        - price_currency
        - selected_options
      properties:
        product_variant_id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        product_title:
          type: string
        product_description:
          type: string
        product_description_html:
          type: string
        product_vendor:
          type: string
        product_type:
          type: string
        product_tags:
          type: array
          items:
            type: string
        product_handle:
          type: string
        product_status:
          $ref: "#/components/schemas/ProductStatus"
        product_images:
          type: array
          items:
            type: string
        product_published_at:
          type: string
          nullable: true
        product_created_at:
          type: string
        product_updated_at:
          type: string
        title:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        price_in_minor_units:
          type: integer
          format: int64
        price_currency:
          type: string
        selected_options:
          type: array
          items:
            $ref: "#/components/schemas/SelectedOption"
        image_url:
          type: string
          nullable: true
    UpsertProductVariantsRequest:
      type: object
      required: [shopify_subdomain, product_variants]
      properties:
        shopify_subdomain:
          type: string
        product_variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantItem"
    UpsertProductVariantsResponse:
      type: object
      required: [upserted]
      properties:
        upserted:
          type: integer
    DeleteProductVariantsRequest:
      type: object
      required: [shopify_subdomain, product_variant_ids]
      properties:
        shopify_subdomain:
          type: string
        product_variant_ids:
          type: array
          items:
            type: integer
            format: int64
    DeleteProductVariantsResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
    ShipmentLineItem:
      type: object
      required: [product_variant_id, quantity]
      properties:
        product_variant_id:
          type: integer
          format: int64
        quantity:
          type: integer
    FulfillmentPayload:
      type: object
      description: |
        One shipment you want Shopify to know about: which fulfillment order, tracking number,
        optional carrier/URL, and which line items (by variant id) ship in this box.
      required: [fulfillment_order_id, tracking_number, line_items]
      properties:
        fulfillment_order_id:
          type: integer
          format: int64
        tracking_number:
          type: string
        carrier:
          type: string
          nullable: true
        tracking_url:
          type: string
          nullable: true
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentLineItem"
    SyncShipmentsWithFulfillmentsPayload:
      type: object
      description: |
        **When a supplier ships something:** tell us the shop, the Shopify order id, any old fulfillments
        to cancel, and the new shipments to create with tracking.
      required: [shopify_subdomain, shopify_order_id, replace_fulfillment_ids, new_fulfillments]
      properties:
        shopify_subdomain:
          type: string
        shopify_order_id:
          type: integer
          format: int64
        replace_fulfillment_ids:
          type: array
          items:
            type: integer
            format: int64
        new_fulfillments:
          type: array
          items:
            $ref: "#/components/schemas/FulfillmentPayload"
    SyncShipmentsWithFulfillmentsResponse:
      type: object
      required: [new_fulfillment_ids]
      properties:
        new_fulfillment_ids:
          type: array
          items:
            type: integer
            format: int64
    TrackingUpdatePayload:
      type: object
      description: |
        **When tracking changes** (for example from a carrier): which shop, which fulfillment,
        what status, when it happened, and an optional note.
      required: [shopify_subdomain, fulfillment_id, status, happened_at]
      properties:
        shopify_subdomain:
          type: string
        fulfillment_id:
          type: integer
          format: int64
        status:
          type: string
          description: |
            Plain-text status (for example `in_transit`). The service maps this to what Shopify expects
            (things like “on the way” or “delivered”).
        happened_at:
          type: string
        message:
          type: string
          nullable: true
    TrackingUpdateResponse:
      type: object
      required: [fulfillment_event_id]
      properties:
        fulfillment_event_id:
          type: integer
          format: int64

  parameters:
    DssInternalSecret:
      name: X-DSS-Internal-Secret
      in: header
      required: false
      schema:
        type: string
      description: |
        If whoever deployed the server set the `DSS_INTERNAL_SECRET` environment variable,
        every request must send this header with that same value - like a shared password between services.
