mutation RegisterWebhook($topic: WebhookSubscriptionTopic!, $callbackUrl: URL!, $includeFields: [String!]) {
  webhookSubscriptionCreate(
    topic: $topic,
    webhookSubscription: { callbackUrl: $callbackUrl, includeFields: $includeFields }
  ) {
    userErrors {
      field
      message
    }
    webhookSubscription {
      id
      topic
      includeFields
    }
  }
}
