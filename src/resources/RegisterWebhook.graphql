mutation RegisterWebhook($topic: WebhookSubscriptionTopic!, $uri: String!, $includeFields: [String!]) {
  webhookSubscriptionCreate(
    topic: $topic,
    webhookSubscription: { uri: $uri, includeFields: $includeFields }
  ) {
    userErrors {
      field
      message
    }
    webhookSubscription {
      id
      topic
      includeFields
    }
  }
}
