query GetOrderById($id: ID!) {
  order(id: $id) {
    id
    name
    email
    createdAt
    displayFinancialStatus
    displayFulfillmentStatus
    shippingAddress {
      name
      address1
      address2
      city
      province
      zip
      countryCodeV2
    }
    lineItems(first: 50) {
      edges {
        node {
          id
          title
          quantity
          sku
          variant {
            id
            title
          }
        }
      }
    }
    fulfillmentOrders(first: 20) {
      edges {
        node {
          id
          status
          lineItems(first: 50) {
            edges {
              node {
                id
                totalQuantity
                remainingQuantity
              }
            }
          }
        }
      }
    }
    fulfillments(first: 10) {
      id
      status
      trackingInfo(first: 5) {
        number
        url
        company
      }
    }
  }
}
