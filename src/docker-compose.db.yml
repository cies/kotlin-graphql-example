# Postgres only - isolated from redis / full-stack compose on port 5435.
#
# Usage:
#   docker compose -f docker-compose.db.yml up -d
#   cp .env.test.example .env.test
#   npm run db:test:setup
#
# Point the Next.js dev server at the test DB (see README “Test database”).

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres_dbonly
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_secret
      POSTGRES_DB: crm_test
    ports:
      - "5435:5432"
    volumes:
      - postgres_dbonly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dbonly_data:
